name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm config set registry https://registry.npmmirror.com
          npm ci --no-audit --no-fund
        timeout-minutes: 8

      - name: Typecheck + lint + tests
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Content schema
        run: npm run check:content

      - name: Build
        run: npm run build

      - name: Size budget
        run: npm run check:size

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        timeout-minutes: 10

      - name: Static work pages present
        run: |
          for f in dist/work/*.html; do test -s "$f" || { echo "missing $f"; exit 1; }; done
          test -s dist/sw.js
          echo "work pages + sw.js OK"

      - name: E2E smoke (stage, deep links, back button, theme, lang)
        run: npm run test:e2e
        timeout-minutes: 15

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
